<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - E-Commerce Platform</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="navbar-brand">My Store</div>
            <ul class="navbar-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
            <div class="navbar-search">
                <input type="text" placeholder="Search...">
                <button>Search</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="product-listing">
            <h2>Our Products</h2>
            <div class="product-grid">
                <div class="product-card card">
                    <div class="card-content">
                        <img src="https://via.placeholder.com/150" alt="Product 1">
                        <h3>Product 1</h3>
                        <p class="price">$99.99</p>
                        <button class="button primary">Add to Cart</button>
                    </div>
                </div>
                <div class="product-card card">
                    <div class="card-content">
                        <img src="https://via.placeholder.com/150" alt="Product 2">
                        <h3>Product 2</h3>
                        <p class="price">$49.99</p>
                        <button class="button primary">Add to Cart</button>
                    </div>
                </div>
                 <div class="product-card card">
                    <div class="card-content">
                        <img src="https://via.placeholder.com/150" alt="Product 3">
                        <h3>Product 3</h3>
                        <p class="price">$129.99</p>
                        <button class="button primary">Add to Cart</button>
                    </div>
                </div>
                <div class="product-card card">
                    <div class="card-content">
                        <img src="https://via.placeholder.com/150" alt="Product 4">
                        <h3>Product 4</h3>
                        <p class="price">$79.99</p>
                        <button class="button primary">Add to Cart</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 E-Commerce Platform</p>
    </footer>

</body>
</html>
